name: Build StructMatcher Function

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Function repository
      uses: actions/checkout@v4

    - name: Checkout StructMatcher
      uses: actions/checkout@v4
      with:
        repository: peter-kaagman/StructMatcher
        path: Modules/StructMatcher

    - name: Create deployment tree
      run: |
        mkdir -p build/StructMatcherApi
        mkdir -p build/Modules/StructMatcher

        cp host.json build/
        cp profile.ps1 build/
        cp requirements.psd1 build/

        cp StructMatcherApi/* build/StructMatcherApi/

        cp Modules/StructMatcher/StructMatcher.psm1 build/Modules/StructMatcher
        cp Modules/StructMatcher/StructMatcher.psd1 build/Modules/StructMatcher


    - name: Show structure
      run: |
        pwd
        find build/.

    - name: Create package
      run: |
        cd build
        zip -r ../structmatcher-func.zip .

    - name: Verify package
      run: |
        ls -lh
        unzip -l structmatcher-func.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: structmatcher-func
        path: structmatcher-func.zip

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Verify Azure Access
      run: |
        az account show

    - name: Deploy Function App
      uses: Azure/functions-action@v1
      with:
          app-name: structmatcher-func
          package: structmatcher-func.zip
