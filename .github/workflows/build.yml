name: Build StructMatcher Function

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Function repository
      uses: actions/checkout@v4

    - name: Show structure
      run: |
        pwd
        find .

    - name: Create package
      run: |
        zip -r structmatcher-func.zip \
          host.json \
          profile.ps1 \
          requirements.psd1 \
          StructMatcherApi
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: structmatcher-func
        path: structmatcher-func.zip
    - name: Deploy to Azure Function
      uses: Azure/functions-action@v1
      with:
        app-name: structmatcher-func
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        package: structmatcher-func.zip
